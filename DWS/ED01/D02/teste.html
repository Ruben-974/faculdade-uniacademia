<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro</title>
    <!-- Link do Bootstrap 5 via CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-4" style="max-width: 800px;">
        
        <!-- CAMINHO DE NAVEGAÇÃO (Breadcrumb) -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item"><a href="#">Painel</a></li>
                <li class="breadcrumb-item active" aria-current="page">Cadastro de Usuário</li>
            </ol>
        </nav>

        <!-- PAINEL DE IDENTIFICAÇÃO (Card) -->
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Identificação do Novo Usuário</h5>
            </div>
            <div class="card-body">
                
                <!-- FORMULÁRIO -->
                <form>
                    <div class="row g-3">
                        <!-- CAMPOS DE TEXTO -->
                        <div class="col-md-6">
                            <label for="nome" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" placeholder="Digite o nome">
                        </div>
                        
                        <div class="col-md-6">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com">
                        </div>

                        <!-- LISTA DE OPÇÕES (Select) -->
                        <div class="col-md-6">
                            <label for="perfil" class="form-label">Perfil de Acesso</label>
                            <select class="form-select" id="perfil">
                                <option selected disabled value="">Escolha uma opção...</option>
                                <option value="1">Administrador</option>
                                <option value="2">Editor</option>
                                <option value="3">Usuário Padrão</option>
                            </select>
                        </div>

                        <!-- CAIXAS DE SELEÇÃO (Checkbox) -->
                        <div class="col-12 mt-4">
                            <label class="form-label d-block fw-semibold">Notificações por E-mail</label>
                            
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="checkAlertas" value="alertas">
                                <label class="form-check-input-label" for="checkAlertas">Alertas do sistema</label>
                            </div>
                            
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="checkRelatorios" value="relatorios">
                                <label class="form-check-input-label" for="checkRelatorios">Relatórios semanais</label>
                            </div>
                        </div>

                        <!-- BOTÃO PARA ENVIAR OS DADOS -->
                        <div class="col-12 mt-4 text-end">
                            <button type="button" class="btn btn-secondary me-2">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Enviar Dados</button>
                        </div>
                    </div>
                </form>

            </div>
        </div>

    </div>

    <!-- Script do Bootstrap (necessário para componentes interativos) -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
